# Production configuration with AWS RDS
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # Backend - Production Configuration
  backend:
    build:
      context: ./zaban_backend
      dockerfile: Dockerfile.prod
      args:
        HUGGING_FACE_TOKEN: ${HUGGING_FACE_TOKEN}
    env_file:
      - ./zaban_backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Production model caches (host paths for persistence)
      - /data/ml_models/huggingface:/app/.cache/huggingface
      - /data/ml_models/whisper:/root/.cache/whisper
      - /data/ml_models/fasttext:/root/.cache/zaban/models
    networks:
      - zaban-network

  # Frontend - Production Configuration
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    restart: always
    deploy: {}
    networks:
      - zaban-network

volumes:
  ml_models_cache:

networks:
  zaban-network:
    driver: bridge
