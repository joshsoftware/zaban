# Production configuration with AWS RDS
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # Backend - Production Configuration
  backend:
    build:
      context: ./zaban_backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./zaban_backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Production model caches (host paths for persistence)
      - /data/ml_models/huggingface:/app/.cache/huggingface
      - /data/ml_models/whisper:/root/.cache/whisper
      - /data/ml_models/fasttext:/root/.cache/zaban/models
    networks:
      - zaban-network

  # Frontend - Production Configuration
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - zaban-network

volumes:
  ml_models_cache:

networks:
  zaban-network:
    driver: bridge
